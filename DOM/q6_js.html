<!DOCTYPE html>
<html>

<head>
    <title>Student Table Filter</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }
        
        input {
            padding: 10px;
            margin-bottom: 15px;
        }
        
        table {
            border-collapse: collapse;
            width: 400px;
        }
        
        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2>Student Search</h2>

    <input type="text" id="search" placeholder="Search student">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
            </tr>
        </thead>

        <tbody id="studentList">
            <tr>
                <td>Anjali</td>
                <td>CSE</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Rahul</td>
                <td>IT</td>
                <td>8.0</td>
            </tr>
            <tr>
                <td>Priya</td>
                <td>ECE</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td>Aman</td>
                <td>CSE</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Neha</td>
                <td>IT</td>
                <td>8.8</td>
            </tr>
        </tbody>
    </table>

    <p id="message"></p>

    <script>
        let search = document.getElementById("search");
        let rows = document.querySelectorAll("#studentList tr");
        let message = document.getElementById("message");

        search.addEventListener("input", function() {
            let value = search.value.toLowerCase();
            let found = 0;

            rows.forEach(function(row) {
                let text = row.innerText.toLowerCase();

                if (text.includes(value)) {
                    row.style.display = "";
                    found++;
                } else {
                    row.style.display = "none";
                }
            });

            if (found === 0) {
                message.innerText = "No results found";
            } else {
                message.innerText = "";
            }
        });
    </script>

</body>

</html>
