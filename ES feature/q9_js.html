<!DOCTYPE html>
<html>

<head>
    <title>JSON Audit</title>
</head>

<body>
    <h2>JSON Audit</h2>

    <script>
        "use strict";

        const rawData = [
            '{"user":"Alex","age":25}',
            '{"id":2}',
            '{invalid}',
            '{"user":"Mina","age":"22"}'
        ];

        const clean = [];
        const errors = [];
        const under18 = [];

        for (let i = 0; i < rawData.length; i++) {
            try {
                const obj = JSON.parse(rawData[i]);

                if (obj.user === undefined || obj.age === undefined) {
                    throw new Error("Missing user or age");
                }

                obj.age = Number(obj.age);

                if (!Number.isFinite(obj.age)) {
                    throw new Error("Invalid age");
                }

                clean.push(obj);

                if (obj.age < 18) {
                    under18.push(obj);
                }
            } catch (error) {
                errors.push({
                    line: i + 1,
                    data: rawData[i],
                    error: error.message
                });
            }

            // Debug: Set breakpoints inside try and catch.
        }

        console.log("Clean Data:", clean);
        console.log("Errors:", errors);
        console.log("Users Under 18:", under18);
    </script>
</body>

</html>
