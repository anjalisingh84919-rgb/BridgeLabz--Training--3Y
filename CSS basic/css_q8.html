<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 65px;
            background-color: #263238;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 25px;
            z-index: 10;
        }
        
        .layout {
            display: flex;
            padding-top: 65px;
            min-height: 100vh;
        }
        
        aside {
            width: 220px;
            min-height: calc(100vh - 65px);
            background-color: #37474f;
            padding: 25px;
            color: white;
        }
        
        aside a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 5px;
        }
        
        aside a:hover {
            background-color: #546e7a;
        }
        
        main {
            flex: 1;
            padding: 30px;
        }
        
        .boxes {
            display: flex;
            gap: 25px;
        }
        
        .box {
            flex: 1;
            min-height: 180px;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px #ccc;
        }
        
        .box p {
            font-size: 2rem;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .layout {
                flex-direction: column;
            }
            aside {
                width: 100%;
                min-height: auto;
            }
            .boxes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="layout">

        <aside>
            <h2>Menu</h2>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>

            <h1>Dashboard</h1>

            <div class="boxes">

                <section class="box">
                    <h2>Total Projects</h2>
                    <p>12</p>
                </section>

                <section class="box">
                    <h2>Completed Tasks</h2>
                    <p>35</p>
                </section>

                <section class="box">
                    <h2>Pending Tasks</h2>
                    <p>8</p>
                </section>

            </div>

        </main>

    </div>

</body>

</html>
