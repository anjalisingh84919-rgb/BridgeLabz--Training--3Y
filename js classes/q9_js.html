<!DOCTYPE html>
<html>

<head>
    <title>Shopping Cart</title>
</head>

<body>
    <h2>Shopping Cart</h2>

    <label>Coupon Code:</label>
    <input type="text" id="coupon" placeholder="SAVE20 or DISC10">
    <button onclick="applyCoupon()">Apply Coupon</button>

    <p id="output"></p>

    <script>
        "use strict";

        class Cart {
            constructor() {
                this.items = [];
            }

            addItem(name, price, quantity) {
                this.items.push({
                    name,
                    price,
                    quantity
                });
            }

            getTotal() {
                return this.items.reduce(
                    (total, item) => total + item.price * item.quantity,
                    0
                );
            }
        }

        const cart = new Cart();

        cart.addItem("Laptop", 50000, 1);
        cart.addItem("Mouse", 500, 2);
        cart.addItem("Keyboard", 1500, 1);

        function applyCoupon() {
            const coupon = document.getElementById("coupon").value.trim();
            const output = document.getElementById("output");
            const total = cart.getTotal();

            const validCoupon = /^(SAVE20|DISC10)$/.test(coupon);

            if (!validCoupon) {
                output.textContent = "Invalid coupon code!";
                output.style.color = "red";
                return;
            }

            const discountPercent = Number(coupon.match(/\d+/)[0]);
            const discount = total * discountPercent / 100;
            const finalTotal = total - discount;

            output.textContent =
                `Original Total: ₹${total} | ` +
                `Discount: ${discountPercent}% | ` +
                `Discount Amount: ₹${discount} | ` +
                `Final Total: ₹${finalTotal}`;

            output.style.color = "green";

            console.log("Cart Items:", cart.items);
            console.log("Original Total:", total);
            console.log("Discount:", discount);
            console.log("Final Total:", finalTotal);
        }

        console.log("Cart Items:", cart.items);
        console.log("Cart Total:", cart.getTotal());
    </script>
</body>

</html>
