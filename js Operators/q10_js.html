<!DOCTYPE html>
<html>

<head>
    <title>Q10 - Department Evaluator</title>
</head>

<body>
    <h2>Departmental Employee Evaluator</h2>
    <button onclick="evaluateDepartments()">Evaluate Departments</button>
    <div id="result"></div>

    <script>
        const departments = [
            ["HR", 72],
            ["Finance", 88],
            ["Tech", 95],
            ["Support", 63]
        ];

        function evaluateDepartments() {
            let output = "";

            // Evaluate each department
            for (let department of departments) {
                let name = department[0];
                let score = department[1];
                let performance;

                if (score >= 90) {
                    performance = "Excellent";
                } else if (score >= 75) {
                    performance = "Good";
                } else if (score >= 60) {
                    performance = "Average";
                } else {
                    performance = "Needs Improvement";
                }

                output += "Department: " + name +
                    " | Score: " + score +
                    " | Performance: " + performance + "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>

</html>
