<!DOCTYPE html>

<html>

<head>
    <title> Callback Function</title>


    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }
        
        .container {
            background: white;
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
        }
        
        button {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>


</head>

<body>

    ```
    <div class="container">
        <h2>Callback Function</h2>
        <button onclick="runQ1()">Run Code</button>
        <p id="output"></p>
    </div>

    <script>
        // Q1: Callback Function

        function greetUser(name, callback) {

            document.getElementById("output").innerHTML +=
                "Hello " + name + "<br>";

            callback();
        }

        function showEndMessage() {

            document.getElementById("output").innerHTML +=
                "Welcome to the course!";

        }

        function runQ1() {

            document.getElementById("output").innerHTML = "";

            greetUser("Anjali", showEndMessage);
        }
    </script>


</body>

</html>
