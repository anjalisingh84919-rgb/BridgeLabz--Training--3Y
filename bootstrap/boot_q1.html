<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            min-height: 75vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #e8f4ff, #ffffff);
        }
        
        .hero h1 {
            font-size: 3.5rem;
            font-weight: bold;
        }
        
        .hero img {
            max-height: 400px;
            object-fit: cover;
        }
        
        @media (max-width: 768px) {
            .hero {
                text-align: center;
            }
            .hero h1 {
                font-size: 2.3rem;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">
                    TechNova
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMenu">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <main>

        <section class="hero">

            <div class="container">

                <!-- Bootstrap row and columns -->
                <div class="row align-items-center g-5">

                    <div class="col-md-6">

                        <h1>
                            Build Your Digital Future
                        </h1>

                        <p class="lead mt-3">
                            TechNova helps businesses create modern, secure and scalable digital solutions.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg mt-3">
                            Get Started
                        </a>

                    </div>

                    <div class="col-md-6">

                        <img src="https://picsum.photos/id/180/700/450" class="img-fluid rounded shadow" alt="Technology">

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">
            &copy; 2026 TechNova. All Rights Reserved.
        </p>
    </footer>

</body>

</html>
