<!DOCTYPE html>
<html>

<head>
    <title>Q8 - Discount Evaluator</title>
</head>

<body>
    <h2>Dynamic Discount Evaluator</h2>
    <button onclick="calculateDiscount()">Calculate Discount</button>
    <p id="result"></p>

    <script>
        const cart = [{
            item: "Laptop",
            category: "electronics",
            price: 45000
        }, {
            item: "Shoes",
            category: "fashion",
            price: 2500
        }, {
            item: "Book",
            category: "education",
            price: 600
        }];

        function calculateDiscount() {
            // Calculate original cart value
            let totalCartValue = cart.reduce(
                (total, product) => total + product.price, 0
            );

            let discountedTotal = 0;
            let output = "";

            // Apply category-wise discounts
            for (let product of cart) {
                let price = product.price;

                if (product.category === "electronics") {
                    price = price * 0.90;
                } else if (product.category === "fashion") {
                    price = price * 0.95;
                }

                discountedTotal += price;

                output += product.item + ": ₹" + price.toFixed(2) + "<br>";
            }

            // Extra discount if cart total exceeds 50000
            if (totalCartValue > 50000) {
                discountedTotal *= 0.95;
            }

            output += "<br>Original Total: ₹" + totalCartValue;
            output += "<br>Final Total: ₹" + discountedTotal.toFixed(2);
            output += "<br>Total Savings: ₹" +
                (totalCartValue - discountedTotal).toFixed(2);

            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>

</html>
