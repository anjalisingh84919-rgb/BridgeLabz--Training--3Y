<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>
    <style>
        V* {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8f0f7;
            color: #222;
        }
        
        .container {
            min-height: 100vh;
            /* Center form vertically and horizontally */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        form {
            width: 450px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #bbb;
        }
        
        form h1 {
            text-align: center;
        }
        
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-shadow: 0 2px 5px #ddd;
            font-size: 1rem;
        }
        /* Border changes when input is selected */
        
        input:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #336699;
        }
        
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #263238;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #455a64;
        }
    </style>
</head>

<body>
    <main class="container">
        <form>
            <h1>Contact Us</h1><label for="name">Name</label><input type="text" id="name" placeholder="Enter your name"><label for="email">Email</label><input type="email" id="email" placeholder="Enter your email"><label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Enter subject"><label for="message">Message</label><textarea id="message" rows="5" placeholder="Enter your message"></textarea><button type="submit">Send Message</button></form>
    </main>
</body>

</html>
