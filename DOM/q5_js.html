<!DOCTYPE html>
<html>

<head>
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        
        .gallery img {
            width: 150px;
            height: 120px;
            margin: 10px;
            cursor: pointer;
        }
        
        #modal {
            display: none;
            position: fixed;
            background: rgba(0, 0, 0, 0.8);
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }
        
        #modal img {
            width: 500px;
            max-width: 85%;
        }
        
        #modalContent {
            background: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h2>Image Gallery</h2>

    <div class="gallery" id="gallery">
        <img src="https://picsum.photos/id/10/500/400">
        <img src="https://picsum.photos/id/20/500/400">
        <img src="https://picsum.photos/id/30/500/400">
        <img src="https://picsum.photos/id/40/500/400">
        <img src="https://picsum.photos/id/50/500/400">
        <img src="https://picsum.photos/id/60/500/400">
    </div>

    <div id="modal">
        <div id="modalContent">
            <img id="bigImage" src="">
            <br>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let gallery = document.getElementById("gallery");
        let modal = document.getElementById("modal");
        let bigImage = document.getElementById("bigImage");

        gallery.addEventListener("click", function(event) {
            if (event.target.tagName === "IMG") {
                bigImage.src = event.target.src;
                modal.style.display = "flex";
            }
        });

        modal.addEventListener("click", function() {
            closeModal();
        });

        document.getElementById("modalContent")
            .addEventListener("click", function(event) {
                event.stopPropagation();
            });

        function closeModal() {
            modal.style.display = "none";
        }
    </script>

</body>

</html>
