<!DOCTYPE html>
<html>

<head>
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        
        .card {
            height: 150px;
            padding: 20px;
            background: lightgray;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: 0.3s;
        }
        
        .card:hover {
            transform: scale(1.05);
        }
        
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Product Gallery</h1>

    <div class="gallery">

        <div class="card">
            <h2>Shoes</h2>
            <p>₹1200</p>
        </div>

        <div class="card">
            <h2>Watch</h2>
            <p>₹1500</p>
        </div>

        <div class="card">
            <h2>Bag</h2>
            <p>₹900</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p>₹2000</p>
        </div>

        <div class="card">
            <h2>Mobile</h2>
            <p>₹15000</p>
        </div>

        <div class="card">
            <h2>Laptop</h2>
            <p>₹45000</p>
        </div>

        <div class="card">
            <h2>Camera</h2>
            <p>₹25000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p>₹1200</p>
        </div>

    </div>

</body>

</html>
