<!DOCTYPE html>
<html>

<head>
    <title>Q9 - Odd Even Analyzer</title>
</head>

<body>
    <h2>Odd-Even Number Analyzer</h2>
    <button onclick="analyzeNumbers()">Analyze Numbers</button>
    <div id="result"></div>

    <script>
        function analyzeNumbers() {
            let numbers = [];
            let results = [];

            // Create numbers from 1 to 30
            for (let i = 1; i <= 30; i++) {
                numbers.push(i);
            }

            // Classify each number
            for (let number of numbers) {
                if (number % 3 === 0 && number % 5 === 0) {
                    results.push(number + " - FizzBuzz");
                } else if (number % 2 === 0) {
                    results.push(number + " - Even");
                } else {
                    results.push(number + " - Odd");
                }
            }

            // Display results
            document.getElementById("result").innerHTML =
                results.join("<br>");
        }
    </script>
</body>

</html>
