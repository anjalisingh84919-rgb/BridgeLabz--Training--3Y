<!DOCTYPE html>
<html>

<head>
    <title>Q1 - Scope Conflict Resolver</title>
</head>

<body>
    <h2>Scope Conflict Resolver</h2>
    <button onclick="calculateSalary()">Calculate Salary</button>
    <p id="result"></p>

    <script>
        // Global variable
        let bonus = 5000;

        function calculateSalary() {
            let salary = 40000;
            let isPermanent = true;

            if (isPermanent) {
                salary += bonus;
            }

            let output = "Permanent Employee Salary: " + salary;

            // Change local variable
            isPermanent = false;
            let newSalary = 40000;

            if (isPermanent) {
                newSalary += bonus;
            }

            output += "<br>Temporary Employee Salary: " + newSalary;
            output += "<br>Global Bonus: " + bonus;

            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>

</html>
