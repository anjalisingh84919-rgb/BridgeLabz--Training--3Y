<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .product-card img {
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <header class="bg-dark text-white text-center p-4">

        <h1>My Online Store</h1>

        <p class="mb-0">
            Quality products at affordable prices
        </p>

    </header>

    <main class="container py-5">

        <h2 class="text-center mb-5">
            Our Products
        </h2>

        <!-- row creates Bootstrap row -->
        <section class="row g-4">

            <!-- col-md-3 = 4 columns on desktop -->

            <article class="col-12 col-sm-6 col-md-3">

                <div class="card product-card shadow-sm h-100">

                    <img src="https://picsum.photos/id/1/400/300" class="card-img-top" alt="Laptop">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Laptop
                        </h5>

                        <p class="text-success fw-bold">
                            ₹55,000
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </article>

            <article class="col-12 col-sm-6 col-md-3">

                <div class="card product-card shadow-sm h-100">

                    <img src="https://picsum.photos/id/20/400/300" class="card-img-top" alt="Camera">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Camera
                        </h5>

                        <p class="text-success fw-bold">
                            ₹35,000
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </article>

            <article class="col-12 col-sm-6 col-md-3">

                <div class="card product-card shadow-sm h-100">

                    <img src="https://picsum.photos/id/96/400/300" class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Headphones
                        </h5>

                        <p class="text-success fw-bold">
                            ₹2,500
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </article>

            <article class="col-12 col-sm-6 col-md-3">

                <div class="card product-card shadow-sm h-100">

                    <img src="https://picsum.photos/id/119/400/300" class="card-img-top" alt="Smart Watch">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Smart Watch
                        </h5>

                        <p class="text-success fw-bold">
                            ₹4,999
                        </p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </article>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            &copy; 2026 My Online Store
        </p>

    </footer>

</body>

</html>
