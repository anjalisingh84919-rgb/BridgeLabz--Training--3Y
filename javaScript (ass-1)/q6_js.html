<!DOCTYPE html>
<html>

<head>
    <title>Discount System</title>
</head>

<body>

    <h2>Progressive Discount System</h2>
    <p id="result"></p>

    <script>
        let total = 7500;
        let discount = 0;

        if (total >= 10000) {
            discount = 25;
        } else if (total >= 5000) {
            discount = 15;
        } else if (total >= 2000) {
            discount = 5;
        }

        let discountAmount = total * discount / 100;
        let finalPrice = Math.round(total - discountAmount);

        document.getElementById("result").innerHTML =
            `Original Total: ₹${total}<br>
             Discount: ${discount}%<br>
             Discount Amount: ₹${Math.round(discountAmount)}<br>
             Final Price: ₹${finalPrice}`;
    </script>

</body>

</html>
