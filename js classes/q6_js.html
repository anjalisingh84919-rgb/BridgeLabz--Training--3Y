<!DOCTYPE html>
<html>

<head>
    <title>Employee Management</title>
</head>

<body>
    <h2>Employee Management System</h2>

    <script>
        "use strict";

        class Employee {
            constructor(id, name, department, salary) {
                this.id = id;
                this.name = name;
                this.department = department;
                this.salary = salary;
            }

            getAnnualSalary() {
                return this.salary * 12;
            }

            applyBonus(percent) {
                this.salary += this.salary * percent / 100;
            }
        }

        const employees = [
            new Employee(1, "Amit", "IT", 40000),
            new Employee(2, "Sara", "HR", 35000),
            new Employee(3, "Kiran", "Sales", 45000),
            new Employee(4, "Ravi", "IT", 50000),
            new Employee(5, "Neha", "Finance", 42000)
        ];

        employees.forEach(employee => {
            console.log("Name:", employee.name);
            console.log("Department:", employee.department);
            console.log("Annual Salary:", employee.getAnnualSalary());
        });

        const totalPayout = employees.reduce(
            (total, employee) => total + employee.getAnnualSalary(),
            0
        );

        console.log("Total Annual Payout:", totalPayout);

        employees[0].applyBonus(10);
        console.log("Amit's salary after bonus:", employees[0].salary);
    </script>
</body>

</html>
