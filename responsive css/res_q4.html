<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Typography</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        .typography-section {
            max-width: 1000px;
            margin: 80px auto;
            padding: 50px 30px;
            text-align: center;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }
        
        h1 {
            font-size: clamp(1.5rem, 4vw, 3rem);
            margin-bottom: 25px;
        }
        
        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            line-height: 1.6;
        }
        
        @media (max-width: 700px) {
            .typography-section {
                margin: 30px 15px;
                padding: 30px 20px;
            }
            p {
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <main>

        <section class="typography-section">

            <h1>
                Responsive Typography
            </h1>

            <p>
                Responsive typography allows text to automatically adjust according to the screen size. The clamp() function helps create flexible and readable text on different devices.
            </p>

        </section>

    </main>

</body>

</html>
