<!DOCTYPE html>
<html>

<head>
    <title>Pricing Plans</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }
        
        h1 {
            margin: 40px;
        }
        
        .plans {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px;
            align-items: stretch;
        }
        
        .plan {
            width: 30%;
            padding: 30px;
            border: 2px solid #ccc;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 5px 15px #ccc;
            /* Smooth hover animation */
            transition: 0.3s;
        }
        
        .plan:hover {
            transform: scale(1.05);
            background-color: #eef7ff;
        }
        
        .plan h3 {
            font-size: 1.5rem;
        }
        
        .plan li {
            margin: 15px;
            text-align: left;
        }
        
        .plan a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        
        .popular {
            border: 4px solid #336699;
        }
        
        @media (max-width: 600px) {
            .plans {
                flex-direction: column;
            }
            .plan {
                width: auto;
            }
        }
    </style>
</head>

<body>

    <h1>Our Pricing Plans</h1>

    <main class="plans">

        <div class="plan">
            <h2>Basic</h2>
            <h3>₹199 / Month</h3>

            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <h3>₹499 / Month</h3>

            <ul>
                <li>15 Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <h3>₹999 / Month</h3>

            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <a href="#">Choose Plan</a>
        </div>

    </main>

</body>

</html>
