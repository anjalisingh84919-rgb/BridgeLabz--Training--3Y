<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Shoes Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #5f5f5f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .card {
            width: 215px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .image-section {
            width: 100%;
            height: 168px;
            position: relative;
            overflow: hidden;
        }
        
        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .discount {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .heart {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background-color: white;
            font-size: 23px;
            cursor: pointer;
        }
        
        .heart:hover {
            background-color: #eeeeee;
        }
        
        .content {
            padding: 18px 13px 14px;
        }
        
        .category {
            color: #0757c9;
            font-size: 12px;
            text-decoration: underline;
        }
        
        h2 {
            color: #0757c9;
            font-size: 16px;
            margin-top: 7px;
            margin-bottom: 6px;
            text-decoration: underline;
        }
        
        .rating {
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .rating span {
            color: #f5b400;
        }
        
        .rating small {
            color: #777;
            margin-left: 4px;
        }
        
        .price {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .price del {
            color: #777;
            font-size: 11px;
            font-weight: normal;
            margin-left: 7px;
        }
        
        .cart {
            width: 100%;
            height: 30px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .cart:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image-section">
            <img src="product-shoe.png" alt="Sports Shoes">

            <span class="discount">
                20% OFF
            </span>
            <button class="heart">♡</button>
        </div>
        <div class="content">
            <span class="category">
                SPORTS SHOES
            </span>
            <h2>
                Premium Running Shoes
            </h2>
            <div class="rating">
                <span>★ ★ ★ ★ ★</span>
                <small>(120)</small>
            </div>
            <div class="price">₹1,999
                <del>₹2,499</del>
            </div>
            <button class="cart">
                Add to Cart
            </button>
        </div>
    </div>
</body>

</html>
