<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Password</title>
</head>

<body>
    <h1>Check Valid Password</h1>

    <script>
        let password = "Anjali@123";

        function checkPassword(password) {
            password = password.trim();

            let length = password.length >= 6;
            let uppercase = /[A-Z]/.test(password);
            let lowercase = /[a-z]/.test(password);
            let digit = /[0-9]/.test(password);
            let special = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

            if (length && uppercase && lowercase && digit && special) {
                return true;
            } else {
                return false;
            }
        }

        let result = checkPassword(password);

        if (result) {
            console.log("Valid Password");
        } else {
            console.log("Invalid Password");
        }
    </script>

</body>

</html>
