<!DOCTYPE html>
<html>

<head>
    <title>Course Registration</title>
</head>

<body>

    <h1>Course Registration Form</h1>

    <form>

        <fieldset>
            <legend>Student Details</legend>

            Name:
            <input type="text">
            <br><br> Email:
            <input type="email">
            <br><br> Course:
            <select>
                <option>Java</option>
                <option>Python</option>
                <option>Web Development</option>
                <option>Data Science</option>
            </select>

            <br><br>

            <input type="submit" value="Register">

        </fieldset>

    </form>

    <h2>Course Schedule</h2>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>10 AM</td>
            <td>Mr. Sharma</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>11 AM</td>
            <td>Ms. Priya</td>
        </tr>

    </table>

</body>

</html>
