<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        
        header {
            text-align: center;
            padding: 30px;
            background-color: #333;
            color: white;
        }
        
        header h1 {
            margin-bottom: 10px;
        }
        
        .gallery {
            display: grid;
            /* Required Grid */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }
        
        figure {
            background-color: white;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }
        
        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            transition: filter 0.5s ease;
        }
        
        .blur {
            filter: blur(3px);
        }
        
        .grayscale {
            filter: grayscale(100%);
        }
        
        .sepia {
            filter: sepia(100%);
        }
        
        .brightness {
            filter: brightness(50%);
        }
        
        .contrast {
            filter: contrast(200%);
        }
        
        .hue {
            filter: hue-rotate(90deg);
        }
        /* Remove filter on hover */
        
        figure img:hover {
            filter: none;
        }
        
        figcaption {
            padding: 12px;
            font-weight: bold;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
        
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>CSS Filter Effects</p>
    </header>

    <main>

        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <figcaption>Blur Effect</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Nature">
                <figcaption>Grayscale Effect</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1018/500/350" alt="River">
                <figcaption>Sepia Effect</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1020/500/350" alt="Forest">
                <figcaption>Brightness Effect</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1024/500/350" alt="Animal">
                <figcaption>Contrast Effect</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1035/500/350" alt="Lake">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>Responsive Image Gallery</p>
    </footer>

</body>

</html>
