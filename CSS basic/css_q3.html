<!DOCTYPE html>
<html>

<head>
    <title>Team Members</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        header {
            text-align: center;
            padding: 30px;
            background-color: #243b55;
            color: white;
        }
        
        .team {
            display: flex;
            gap: 25px;
            justify-content: center;
            padding: 50px;
        }
        
        .card {
            width: 30%;
            padding: 25px;
            margin: 10px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 15px;
            box-shadow: 0 5px 15px #bbb;
            text-align: center;
        }
        
        .card h3 {
            color: #336699;
        }
        
        .card:first-child {
            background-color: #e4f1ff;
            border: 3px solid #336699;
        }
        
        @media (max-width: 600px) {
            .team {
                flex-direction: column;
                padding: 20px;
            }
            .card {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Our Team</h1>
        <p>Meet our talented team members</p>
    </header>

    <main class="team">

        <div class="card">
            <h2>Anjali Singh</h2>
            <h3>Team Lead</h3>
            <p>
                Anjali manages the team and coordinates project activities.
            </p>
        </div>

        <div class="card">
            <h2>Rahul Sharma</h2>
            <h3>Developer</h3>
            <p>
                Rahul works on coding and developing new features.
            </p>
        </div>

        <div class="card">
            <h2>Priya Gupta</h2>
            <h3>Designer</h3>
            <p>
                Priya designs attractive and user-friendly interfaces.
            </p>
        </div>

    </main>

</body>

</html>
