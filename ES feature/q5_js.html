<!DOCTYPE html>
<html>

<head>
    <title>Hoisting Lab</title>
</head>

<body>
    <h2>Hoisting Lab</h2>

    <script>
        "use strict";

        var score = 50;

        function announce() {
            console.log("Game started");
        }

        let status = "ready";

        console.log(score);
        announce();

        function startGame() {
            console.log(status);
        }

        startGame();

        const announceArrow = () => {
            console.log("Game started using arrow function");
        };

        announceArrow();

        // var is hoisted with undefined.
        // Function declarations are hoisted.
        // let and const remain in the Temporal Dead Zone
        // before initialization.
        // Arrow functions assigned to const are not hoisted
        // like function declarations.
    </script>
</body>

</html>
