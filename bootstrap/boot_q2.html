<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        
        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
        }
        
        .portfolio {
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <header class="bg-dark text-white text-center p-5">

        <h1 class="fw-bold">
            Anjali Singh
        </h1>

        <p class="lead mb-0">
            Data Science & AI Student
        </p>

    </header>

    <main>

        <section class="container portfolio py-5">

            <div class="text-center">

                <!-- img-fluid makes image responsive -->
                <img src="https://picsum.photos/id/64/300/300" class="img-fluid rounded-circle profile-img" alt="Profile Image">

                <h2 class="mt-4 mb-3 fw-bold">
                    Hello, I'm Anjali
                </h2>

                <p class="text-dark mx-auto" style="max-width: 700px;">

                    I am a Computer Science student interested in Data Science, Machine Learning and Artificial Intelligence. I enjoy learning new technologies and building practical projects.

                </p>

                <!-- Buttons -->
                <div class="mt-4">

                    <button class="btn btn-primary me-2">
                        Hire Me
                    </button>

                    <button class="btn btn-outline-dark">
                        Download CV
                    </button>

                </div>

            </div>

            <!-- Contact Form -->

            <section class="mt-5">

                <h3 class="text-center mb-4">
                    Contact Me
                </h3>

                <form class="mx-auto" style="max-width: 600px;">

                    <div class="mb-3">
                        <label class="form-label">
                            Name
                        </label>

                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Message
                        </label>

                        <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                    </div>

                    <button class="btn btn-success">
                        Send Message
                    </button>

                </form>

            </section>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">

        <p class="mb-0">
            &copy; 2026 Anjali Singh
        </p>

    </footer>

</body>

</html>
