<!DOCTYPE html>
<html>

<head>
    <title>Homepage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: lightblue;
        }
        
        header a {
            text-decoration: none;
            color: black;
        }
        
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }
        
        .box {
            padding: 30px;
            width: 250px;
            text-align: center;
            background: lightgray;
            transition: 0.3s;
        }
        
        .box:hover {
            transform: rotate(2deg);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background: lightblue;
        }
        
        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header><a href="#">Home</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a></header>
    <main>
        <div class="box">
            <h2>Services</h2>
            <p>We provide web development services.</p>
        </div>
        <div class="box">
            <h2>Projects</h2>
            <p>We create different projects.</p>
        </div>
        <div class="box">
            <h2>Contact</h2>
            <p>Contact us for more information.</p>
        </div>
    </main>
    <footer>
        <p>© 2026 My Website</p>
    </footer>
</body>

</html>
