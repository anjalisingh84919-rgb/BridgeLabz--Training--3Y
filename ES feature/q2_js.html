<!DOCTYPE html>
<html>

<head>
    <title>Employee Bonus</title>
</head>

<body>
    <h2>Employee Bonus Calculator</h2>

    <script>
        "use strict";

        const employees = [{
            name: "Amit",
            salary: "45000",
            years: "5"
        }, {
            name: "Sara",
            salary: "38000",
            years: "2"
        }, {
            name: "Kiran",
            salary: "52000",
            years: "7"
        }];

        try {
            for (let emp of employees) {
                if (!emp || emp.salary === undefined ||
                    emp.years === undefined || emp.name === undefined) {
                    throw new Error("Missing employee details");
                }

                const salary = Number(emp.salary);
                const years = Number(emp.years);

                if (!Number.isFinite(salary) ||
                    !Number.isFinite(years)) {
                    throw new Error("Invalid employee data");
                }

                const bonus = years > 3 ?
                    salary * 0.10 :
                    salary * 0.05;

                console.log(`Name: ${emp.name}`);
                console.log(`Salary: ₹${salary}`);
                console.log(`Experience: ${years} years`);
                console.log(`Bonus: ₹${bonus}`);
                console.log(`Total Salary: ₹${salary + bonus}`);
                console.log("--------------------");
            }
        } catch (error) {
            console.log("Error:", error.message);
        }
    </script>
</body>

</html>
